[workspace]
resolver = "2"
members = [
    "forum-model",
    "forum-program",
    "relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
ech-db-client = { git = "https://github.com/ech-bz/ech-db-core", rev = "213ddc67cc9b5ac8c166cfc0026ce568c0004645" }
ech-db-entity = { git = "https://github.com/ech-bz/ech-db-entity", rev = "d320e3e4f9c0a3de9b44f96db4d1bdb0bac799ac" }
ech-db-protocol = { git = "https://github.com/ech-bz/ech-db-core", rev = "213ddc67cc9b5ac8c166cfc0026ce568c0004645" }
bcs = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
foundationdb-tuple = "0.11.0"
foundationdb = { version = "0.11.0", default-features = false, features = ["fdb-7_3"] }
blake2b_simd = "1.0.5"
ed25519-dalek = "3.0.0"
rand = "0.9"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util"] }
tokio-stream = "0.1"
tonic = { version = "0.14.6", features = ["tls-aws-lc", "tls-webpki-roots"] }
futures = "0.3"
wasmi = { version = "2.0.0", features = ["deterministic"] }
wasmi_core = "2.0.0"
clap = { version = "4.6", features = ["derive"] }
toml = "0.9"
thiserror = "2.0"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-sdk-s3 = "1.152"
aws-credential-types = "1.2"
wasmparser = "0.228.0"
wat = "1"
base64 = "0.22"
hex = "0.4"
bytes = "1"
sui-rpc = "0.4.0"
sui-sdk-types = { version = "0.4.0", features = ["serde"] }
sui-crypto = { version = "0.4.0", features = ["ed25519"] }
sui-transaction-builder = "0.4.0"
prost-types = "0.14.1"
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[profile.release]
panic = "abort"
