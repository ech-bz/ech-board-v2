name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install foundationdb client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake perl
          curl -fsSL -o /tmp/fdb-clients.deb https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb
          sudo dpkg -i /tmp/fdb-clients.deb
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.1
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build -p forum-program --release --target wasm32-unknown-unknown
      - run: cargo test --workspace

